name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e . build twine
      - run: python check_release.py --tag "${GITHUB_REF_NAME}"
      - run: python -m unittest -v test_supersaas_mcp.py
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/supersaas-slots-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Wait for PyPI package to be available
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "https://pypi.org/pypi/supersaas-slots-mcp/${version}/json" --output /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "PyPI package version ${version} is not available" >&2
          exit 1
      - name: Install verified MCP publisher
        shell: bash
        run: |
          archive="$(mktemp)"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            --output "$archive"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $archive" | sha256sum --check
          tar -xzf "$archive" mcp-publisher
          chmod +x mcp-publisher
          rm "$archive"
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
